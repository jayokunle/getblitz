# Coolify "Custom Nginx Configuration" for the static notice app
# (getblitz.io, www.getblitz.io, app.getblitz.io, docs.getblitz.io).
#
# - Every page path returns the notice (HTTP 410 Gone, so search engines drop it).
# - API / widget / WebSocket / webhook paths return a JSON "service_discontinued"
#   error with HTTP 410, so integrations fail with a clear message.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        default_type application/json;
        return 410 '{"error":"service_discontinued","message":"The hosted GetBlitz service was discontinued on 19 November 2026. Self-host: https://github.com/jayokunle/getblitz"}';
    }

    location /socket.io/ {
        default_type application/json;
        return 410 '{"error":"service_discontinued"}';
    }

    location = /index.html {
        internal;
    }

    location / {
        error_page 410 /index.html;
        return 410;
    }
}
